version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: erp-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: college_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # 2. Redis Caching Service
  redis-cache:
    image: redis:7-alpine
    container_name: erp-redis-cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # 3. Express Backend API Service
  backend-api:
    build:
      context: ./server
    container_name: erp-backend-api
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/college_erp?schema=public
      - REDIS_URL=redis://redis-cache:6379
      - JWT_SECRET=my_super_secure_college_erp_jwt_secret_key_123
    command: sh -c "npx prisma db push && npm start"
    depends_on:
      - postgres-db
      - redis-cache

  # 4. Vite React Frontend Client Service
  frontend-client:
    build:
      context: ./client
    container_name: erp-frontend-client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

  # 5. Nginx API Gateway Proxy Service
  nginx-gateway:
    image: nginx:alpine
    container_name: erp-nginx-gateway
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
      - frontend-client

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
